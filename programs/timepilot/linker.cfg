FEATURES { STARTADDRESS: default = $2001; }
SYMBOLS {
    __LOADADDR__: type = import;
    __EXEHDR__: type = import;
    __STACKSIZE__: type = weak, value = $0800;
    # The C stack grows down through free RAM below $8000. VIC-only graphics
    # live in the underlying RAM at $8000+, beneath the BASIC ROM mapping.
    __HIMEM__: type = weak, value = $8000;
}
MEMORY {
    ZP: file = "", define = yes, start = $0018, size = $001A;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    HEADER: file = %O, define = yes, start = %S, size = $0010;
    # MAIN/BSS may grow to $4000.  The following $1000 remains an explicit
    # PRG fill gap before the generated flight data at $5000.
    MAIN: file = %O, define = yes, start = __HEADER_LAST__, size = $4000 - __HEADER_LAST__, fill = yes;
    BSS: file = "", start = __ONCE_RUN__, size = $4000 - __ONCE_RUN__;
    SHOT: file = %O, start = $4000, size = $0200;
    GAP: file = %O, start = $4200, size = $0E00, fill = yes;
    FLIGHT: file = %O, start = $5000, size = $0900, fill = yes;
    # Fill the tail: a PRG is contiguous, so HUDDATA must physically reach $8000.
    OBJECT: file = %O, start = $5900, size = $0920, fill = yes;
    HUDGAP: file = %O, start = $6220, size = $1DE0, fill = yes;
    HUD: file = %O, start = $8000, size = $2000;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR: load = HEADER, type = ro;
    STARTUP: load = MAIN, type = ro;
    LOWCODE: load = MAIN, type = ro, optional = yes;
    CODE: load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA: load = MAIN, type = rw;
    INIT: load = MAIN, type = rw;
    ONCE: load = MAIN, type = ro, define = yes;
    BSS: load = BSS, type = bss, define = yes;
    SHOTDATA: load = SHOT, type = ro;
    FLIGHTDATA: load = FLIGHT, type = ro;
    OBJECTCODE: load = OBJECT, type = ro;
    HUDGAPDATA: load = HUDGAP, type = ro, optional = yes;
    HUDDATA: load = HUD, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
